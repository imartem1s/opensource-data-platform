services:

  postgres:
    image: postgres:16
    networks:
      - postgres_net
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
  
  airflow-scheduler:
    image: apache/airflow:3.3.1
    command: scheduler
    restart: always
    networks:
      - postgres_net
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: AMpYQyijpW6_OntVU7S1kW1bGg3FNofr6aryBTGtbnk=
  
  airflow-apiserver:
    command: api-server
    image: apache/airflow:3.3.1
    networks:
     - postgres_net
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow                   
      AIRFLOW__CORE__FERNET_KEY: AMpYQyijpW6_OntVU7S1kW1bGg3FNofr6aryBTGtbnk=
  
  airflow-init:
    image: apache/airflow:3.3.1
    entrypoint: /bin/bash
    networks:
      - postgres_net
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow                   
      AIRFLOW__CORE__FERNET_KEY: AMpYQyijpW6_OntVU7S1kW1bGg3FNofr6aryBTGtbnk=
    command:
      - -c
      - |
        airflow db migrate

  spark-iceberg:
    image: tabulario/spark-iceberg
    container_name: spark-iceberg
    networks:
      - iceberg_net
    depends_on:
      - rest
      - minio
    volumes:
      - ./warehouse:/home/iceberg/warehouse
      - ./notebooks:/home/iceberg/notebooks/notebooks
    environment:
      - AWS_ACCESS_KEY_ID=rootuser
      - AWS_SECRET_ACCESS_KEY=rootpassword
      - AWS_REGION=us-east-1
    ports:
      - 8888:8888
      - 8080:8080
      - 10000:10000
      - 10001:10001
      - "4040:4040" 
      - "4041:4041"

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: iceberg_rest
    networks: 
      - iceberg_net
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=rootuser
      - AWS_SECRET_ACCESS_KEY=rootpassword
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
    
      
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_server
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=rootuser
      - MINIO_ROOT_PASSWORD=rootpassword
      - MINIO_DOMAIN=minio
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  minio-mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: minio_mc
    networks:
      - iceberg_net
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
        /bin/sh -c "
        until /usr/bin/mc alias set dockerminio http://minio:9000 rootuser rootpassword; do
          echo 'building data bucket, done';
          sleep 10;
        done;
        /usr/bin/mc mb dockerminio/warehouse;
        exit 0;
        "

volumes:
  minio-data:
    driver: local
  postgres-db-volume:

networks:
  iceberg_net:
    driver: bridge
  
  postgres_net:
    driver: bridge